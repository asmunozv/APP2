services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autorizacion_pagos_app
    working_dir: /workspace
    volumes:
      - .:/workspace
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - postgres
      - rabbitmq
    command: sleep infinity

  postgres:
    image: postgres:16
    container_name: autorizacion_pagos_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pagos_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: autorizacion_pagos_rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}

volumes:
  pagos_data:
